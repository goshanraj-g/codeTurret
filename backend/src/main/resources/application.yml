spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/codeturret
    username: ${DB_USER:codeturret}
    password: ${DB_PASSWORD:codeturret}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3

llm:
  provider: ${LLM_PROVIDER:openai}
  timeout-seconds: 120
  max-retries: 2
  max-concurrency: ${LLM_MAX_CONCURRENCY:4}
  deep-scan-threshold: 0.7
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com/v1
    fast-model: ${OPENAI_FAST_MODEL:gpt-5.4-mini}
    strong-model: ${OPENAI_STRONG_MODEL:gpt-5.5}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta
    fast-model: gemini-2.5-flash
    strong-model: gemini-2.5-pro

engine:
  line-budget: ${ENGINE_LINE_BUDGET:3000}
  weights:
    ml: 0.35
    static-analysis: 0.30
    reachability: 0.15
    git: 0.10
    structure: 0.10
  semgrep:
    enabled: ${SEMGREP_ENABLED:true}
    command: ${SEMGREP_CMD:semgrep}
    timeout-seconds: 300

github:
  api-url: https://api.github.com

git:
  clone-depth: 50
  max-commits: 50
  max-scan-files: 25
  max-file-size: 50000

snowflake:
  account: ${SNOWFLAKE_ACCOUNT:}
  user: ${SNOWFLAKE_USER:}
  password: ${SNOWFLAKE_PASSWORD:}
  warehouse: ${SNOWFLAKE_WAREHOUSE:CODEBOUNCER_WH}
  database: ${SNOWFLAKE_DATABASE:CODEBOUNCER}
  schema: ${SNOWFLAKE_SCHEMA:CORE}
  cortex-model: llama3.1-8b

encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY:dev-key-change-in-production-32b}

server:
  port: 8080

logging:
  level:
    com.codeturret: INFO
